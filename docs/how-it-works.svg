<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8f8f9d">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#9b6dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- where the link comes from -->
  <rect x="270" y="14" width="180" height="36" rx="18" fill="none" stroke="#8f8f9d" stroke-width="2"/>
  <text x="360" y="37" text-anchor="middle">link from another app</text>

  <!-- main window: gets the tab -->
  <rect x="40" y="110" width="250" height="140" rx="10" fill="none" stroke="#8f8f9d" stroke-width="2"/>
  <path d="M40 138H290" stroke="#8f8f9d" stroke-width="2"/>
  <rect x="52" y="117" width="60" height="15" rx="4" fill="#8f8f9d" fill-opacity="0.35"/>
  <rect x="118" y="117" width="60" height="15" rx="4" fill="#9b6dff"/>
  <path d="M60 166H230M60 188H270M60 210H200" stroke="#8f8f9d" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35"/>
  <text x="165" y="276" text-anchor="middle">main window: gets the new tab</text>

  <!-- video window: miss-me on -->
  <rect x="430" y="110" width="250" height="140" rx="10" fill="none" stroke="#9b6dff" stroke-width="2.5"/>
  <path d="M430 138H680" stroke="#9b6dff" stroke-width="2"/>
  <rect x="442" y="117" width="60" height="15" rx="4" fill="#9b6dff" fill-opacity="0.35"/>
  <g transform="translate(650 113) scale(1.3)">
    <rect x="6.5" y="4.5" width="8.5" height="9" rx="1.5" fill="none" stroke="#9b6dff" stroke-width="1.4"/>
    <path d="M6.5 7.5H15" stroke="#9b6dff" stroke-width="1.4"/>
    <path d="M1 12.5h2a1.5 1.5 0 0 0 1.5-1.5V3.5" fill="none" stroke="#9b6dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2.7 5.2l1.8-1.8 1.8 1.8" fill="none" stroke="#9b6dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M540 176v36l30-18z" fill="#9b6dff"/>
  <text x="555" y="276" text-anchor="middle">video window: miss-me on, keeps playing</text>

  <!-- the tab heads for the video window, then swerves -->
  <path d="M380 52C430 80 445 100 410 98C340 94 220 70 150 106" fill="none" stroke="#9b6dff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#head)"/>
</svg>
